# Needs: the `newrelic:` block in the config (account_id and api_key) and the New Relic infrastructure agent or APM on your hosts.
# Rules in this preset are New Relic NRQL queries, one alert per faceted entity. Servers without New Relic skip them.
rules:
  - id: nr-host-cpu
    name: New Relic host CPU high
    datasource: newrelic
    expr: "SELECT average(cpuPercent) FROM SystemSample FACET hostname"
    warn: 80
    crit: 95
    for_seconds: 600
    unit: percent
    summary: A host's CPU has been saturated.
  - id: nr-host-memory
    name: New Relic host memory high
    datasource: newrelic
    expr: "SELECT average(memoryUsedPercent) FROM SystemSample FACET hostname"
    warn: 85
    crit: 95
    for_seconds: 600
    unit: percent
    summary: A host has little usable memory left.
  - id: nr-host-disk
    name: New Relic disk filling up
    datasource: newrelic
    expr: "SELECT average(diskUsedPercent) FROM StorageSample FACET hostname, mountPoint"
    warn: 85
    crit: 95
    for_seconds: 600
    unit: percent
    summary: A filesystem is nearly full.
