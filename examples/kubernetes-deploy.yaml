# Deploy Nigrani inside a Kubernetes cluster with read-only cluster monitoring.
# Pre-requisite: Apply RBAC first to create the namespace and service account:
#   kubectl apply -f examples/kubernetes-rbac.yaml
#
# Deploy Nigrani:
#   kubectl apply -f examples/kubernetes-deploy.yaml
#
# Access Nigrani locally:
#   kubectl port-forward -n monitoring svc/nigrani 8080:8080
---
apiVersion: v1
kind: Secret
metadata:
  name: nigrani-secret
  namespace: monitoring
type: Opaque
stringData:
  # Change this to a secure random password for Nigrani admin UI access
  NIGRANI_PASSWORD: "change-this-secure-password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nigrani-config
  namespace: monitoring
data:
  nigrani.yaml: |
    # Nigrani in-cluster configuration
    title: Nigrani Cluster Monitor
    
    # Prometheus data source (adjust cluster DNS name if Prometheus runs in another namespace)
    prometheus:
      url: http://prometheus-server.monitoring.svc.cluster.local:9090
    
    # In-cluster Kubernetes discovery:
    # url is left empty so Nigrani automatically discovers and uses the pod's service account and CA
    kubernetes:
      url: ""
      namespaces: [] # empty means all namespaces
    
    # Standard alert presets
    presets: [core, kubernetes]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nigrani-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nigrani
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nigrani
    app.kubernetes.io/component: monitoring-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nigrani
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nigrani
    spec:
      serviceAccountName: nigrani
      containers:
        - name: nigrani
          image: ghcr.io/nikhilrai-tech/nigrani:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NIGRANI_CONFIG
              value: /config/nigrani.yaml
            - name: NIGRANI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nigrani-secret
                  key: NIGRANI_PASSWORD
          volumeMounts:
            - name: config-volume
              mountPath: /config/nigrani.yaml
              subPath: nigrani.yaml
              readOnly: true
            - name: data-volume
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: nigrani-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: nigrani-data
---
apiVersion: v1
kind: Service
metadata:
  name: nigrani
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nigrani
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: nigrani
